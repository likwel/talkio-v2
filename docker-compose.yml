services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: talkio
      POSTGRES_PASSWORD: talkio
      POSTGRES_DB: talkio
    ports:
      - '5434:5432'
    volumes:
      - talkio_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U talkio']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://talkio:talkio@db:5432/talkio?schema=public
      CORS_ORIGIN: http://localhost:5173
      JWT_ACCESS_SECRET: change-me-access
      JWT_REFRESH_SECRET: change-me-refresh
    ports:
      - '4000:4000'
    command: sh -c "npx prisma migrate deploy && node dist/server.js"

volumes:
  talkio_pgdata:
